<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Sonic Unleashed - QTE</title>
<style>
  :root{--bg:#081428;--panel:#0f1724;--text:#dbe7ff;--muted:#9fb4d9}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text)}
  .wrap{width:980px;max-width:96vw;margin:28px auto;padding:18px;border-radius:12px}
  canvas{width:100%;height:560px;border-radius:12px;background:linear-gradient(180deg,#05203a 0%, #071827 100%);display:block}
  .controls{display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .hint{color:var(--muted);font-size:13px}
  button,select{background:#0b273a;border:1px solid rgba(255,255,255,0.08);color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer}
  label{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h2 style="margin:6px 0 12px 0">Sonic Unleashed - QTE</h2>
  <canvas id="game" width="980" height="560"></canvas>
  <div class="controls">
    <div class="hint">Controller support: Chrome/Edge on localhost or HTTPS. Layout is selectable.</div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <label for="layoutSelect">Layout</label>
      <select id="layoutSelect">
        <option value="ps3">PS3</option>
        <option value="xbox360" selected>Xbox 360</option>
      </select>
      <button id="restart">Restart</button>
    </div>
  </div>
</div>
<script>
/*
  Sonic Unleashed - QTE
  Gameplay uses neutral logical buttons:
  FACE_BOTTOM, FACE_RIGHT, FACE_LEFT, FACE_TOP, SHOULDER_LEFT, SHOULDER_RIGHT.
  Layouts decide visuals and raw gamepad interpretation.
*/

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// Sonic Unleashed QTE sound effects.
// Put these WAV files next to the HTML file when running locally.
const SFX = {
  press: new Audio('./38_objsn_trickjump_button.wav'),
  start: new Audio('./16_objes_QTE_icon.wav'),
  success: new Audio('./0017_objsn_trickjump_ok.wav'),
  fail: new Audio('./0018_objsn_trickbjump_ng.wav')
};

function playSfx(name){
  const snd = SFX[name];
  if(!snd) return;
  try{
    snd.currentTime = 0;
    snd.play().catch(()=>{});
  } catch(e){}
}

let DPR = Math.max(1, window.devicePixelRatio || 1);
function setupCanvas(){
  DPR = Math.max(1, window.devicePixelRatio || 1);
  canvas.width = canvas.clientWidth * DPR;
  canvas.height = canvas.clientHeight * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
setupCanvas();

const LOGICAL_BUTTONS = [
  'SHOULDER_RIGHT',
  'SHOULDER_LEFT',
  'FACE_BOTTOM',
  'FACE_RIGHT',
  'FACE_LEFT',
  'FACE_TOP'
];

const PROMPT_BUTTONS_SINGLE = ['FACE_BOTTOM','FACE_RIGHT','FACE_LEFT','FACE_TOP'];
const PROMPT_BUTTONS_MULTI = ['FACE_BOTTOM','FACE_RIGHT','FACE_LEFT','FACE_TOP','SHOULDER_LEFT','SHOULDER_RIGHT'];

const MASH_TIERS = [
  {required:3, time:3000},
  {required:5, time:5000},
  {required:60, time:10000}
];

const LAYOUTS = {
  ps3: {
    name: 'PS3',
    gamepadMap: {
      0:'FACE_BOTTOM',
      1:'FACE_RIGHT',
      2:'FACE_LEFT',
      3:'FACE_TOP',
      4:'SHOULDER_LEFT',
      5:'SHOULDER_RIGHT'
    },
    keyboardMap: {
      'k':'FACE_BOTTOM',
      'l':'FACE_RIGHT',
      'u':'FACE_LEFT',
      'i':'FACE_TOP',
      'h':'SHOULDER_LEFT',
      'j':'SHOULDER_RIGHT'
    },
    buttons: {
      FACE_BOTTOM:   {label:'X',  color:'#2d7ef6', kind:'face'},
      FACE_RIGHT:    {label:'O',  color:'#e64545', kind:'face', scale:1.22},
      FACE_LEFT:     {label:'□',  color:'#ff4fd8', kind:'face', scale:1.75, offsetY:-1.5},
      FACE_TOP:      {label:'△',  color:'#29cc5f', kind:'face', scale:1.08},
      SHOULDER_LEFT: {label:'L1', color:'#ffffff', kind:'shoulder'},
      SHOULDER_RIGHT:{label:'R1', color:'#ffffff', kind:'shoulder'}
    }
  },
  xbox360: {
    name: 'Xbox 360',
    gamepadMap: {
      0:'FACE_BOTTOM',
      1:'FACE_RIGHT',
      2:'FACE_LEFT',
      3:'FACE_TOP',
      4:'SHOULDER_LEFT',
      5:'SHOULDER_RIGHT'
    },
    keyboardMap: {
      'k':'FACE_BOTTOM',
      'l':'FACE_RIGHT',
      'u':'FACE_LEFT',
      'i':'FACE_TOP',
      'h':'SHOULDER_LEFT',
      'j':'SHOULDER_RIGHT'
    },
    buttons: {
      FACE_BOTTOM:   {label:'A',  color:'#29cc5f', kind:'face', fillColor:'#29cc5f', symbolColor:'#ffffff'},
      FACE_RIGHT:    {label:'B',  color:'#e64545', kind:'face', fillColor:'#e64545', symbolColor:'#ffffff'},
      FACE_LEFT:     {label:'X',  color:'#2d7ef6', kind:'face', fillColor:'#2d7ef6', symbolColor:'#ffffff'},
      FACE_TOP:      {label:'Y',  color:'#ffd34d', kind:'face', fillColor:'#ffd34d', symbolColor:'#ffffff'},
      SHOULDER_LEFT: {label:'LB', color:'#ffffff', kind:'shoulder'},
      SHOULDER_RIGHT:{label:'RB', color:'#ffffff', kind:'shoulder'}
    }
  }
};

let currentLayoutKey = 'xbox360';
let currentLayout = LAYOUTS[currentLayoutKey];

function getButtonVisual(logicalButton){
  return currentLayout.buttons[logicalButton] || {label:'?', color:'#bbb', kind:'face'};
}

let running = true;
let score = 0;
let level = 1;
let sequence = [];
let seqType = 'normal';
let inputPos = 0;
let timeLimit = 3000;
let timer = timeLimit;
let gamepadIndex = null;
let lastGPState = {};

const SAVE_KEY = 'sonic_unleashed_qte_record_v1';
let record = loadRecord();
if(record.layout && LAYOUTS[record.layout]){
  currentLayoutKey = record.layout;
  currentLayout = LAYOUTS[currentLayoutKey];
}

function loadRecord(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return {score:0, level:1, date:null, layout:'xbox360'};
    const parsed = JSON.parse(raw);
    return {
      score: Number(parsed.score) || 0,
      level: Number(parsed.level) || 1,
      date: parsed.date || null,
      layout: LAYOUTS[parsed.layout] ? parsed.layout : 'xbox360'
    };
  } catch(e){
    return {score:0, level:1, date:null, layout:'xbox360'};
  }
}

function saveRecord(){
  const isNewRecord = score > record.score;
  if(isNewRecord){
    record.score = Math.floor(score);
    record.level = level;
    record.date = new Date().toISOString();
  }
  record.layout = currentLayoutKey;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(record));
  } catch(e){}
}

function saveLayoutPreference(){
  record.layout = currentLayoutKey;
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify(record));
  } catch(e){}
}

function formatRecordDate(date){
  if(!date) return '—';
  try{
    return new Date(date).toLocaleDateString();
  } catch(e){
    return '—';
  }
}

function rand(max){
  return Math.floor(Math.random()*max);
}

function pickButton(mode='single'){
  const pool = mode === 'multi' ? PROMPT_BUTTONS_MULTI : PROMPT_BUTTONS_SINGLE;
  return pool[rand(pool.length)];
}

function getMashTierForLevel(currentLevel){
  if(currentLevel >= 12) return MASH_TIERS[2];
  if(currentLevel >= 4) return MASH_TIERS[1];
  return MASH_TIERS[0];
}

function generateSequence(){
  playSfx('start');
  const roll = Math.random();

  // Single-button QTEs: face buttons only. Sometimes tap, sometimes mash.
  if(roll < 0.35){
    const isMash = Math.random() < Math.min(0.25 + level * 0.035, 0.65);
    const btn = pickButton('single');

    if(isMash){
      seqType = 'mash';
      const tier = getMashTierForLevel(level);
      sequence = [{type:'mash', logical:btn, required:tier.required, progress:0}];
      timeLimit = tier.time;
    } else {
      seqType = 'normal';
      sequence = [{type:'press', logical:btn}];
      timeLimit = 3000;
    }
  } else {
    // Multi-button QTEs: 3 to 5 buttons, face + shoulder buttons allowed.
    seqType = 'normal';
    const len = 3 + rand(3);
    sequence = [];
    for(let i=0;i<len;i++) sequence.push({type:'press',logical:pickButton('multi')});
    timeLimit = len === 3 ? 3000 : 5000;
  }

  inputPos = 0;
  timer = timeLimit;
}

function failGame(){
  if(!running) return;
  playSfx('fail');
  saveRecord();
  running = false;
}

window.addEventListener('gamepadconnected', e=>{ gamepadIndex = e.gamepad.index; });
window.addEventListener('gamepaddisconnected', e=>{ if(gamepadIndex===e.gamepad.index) gamepadIndex=null; });

function pollGamepad(){
  if(gamepadIndex===null) return;
  const gp = navigator.getGamepads()[gamepadIndex];
  if(!gp) return;

  // Select/Back toggles layout. Start resets the game.
  // Standard mapping: 8 = Select/Back, 9 = Start.
  const selectPressed = Boolean(gp.buttons[8] && gp.buttons[8].pressed);
  const startPressed = Boolean(gp.buttons[9] && gp.buttons[9].pressed);
  const prevSelect = lastGPState['system:select'] || false;
  const prevStart = lastGPState['system:start'] || false;

  if(selectPressed && !prevSelect){
    toggleLayout();
  }
  if(startPressed && !prevStart){
    restartGame();
  }

  lastGPState['system:select'] = selectPressed;
  lastGPState['system:start'] = startPressed;

  if(startPressed) return;

  for(let i=0;i<gp.buttons.length;i++){
    const logical = currentLayout.gamepadMap[i];
    if(!logical) continue;
    const pressed = gp.buttons[i].pressed;
    const stateKey = currentLayoutKey + ':' + logical;
    const prev = lastGPState[stateKey] || false;
    if(pressed && !prev){ handleInput(logical); }
    lastGPState[stateKey] = pressed;
  }
}

window.addEventListener('keydown', e => {
  const logical = currentLayout.keyboardMap[e.key];
  if(logical) handleInput(logical);
});

function handleInput(logical){
  if(!running) return;

  if(seqType==='mash'){
    const current = sequence[0];
    if(logical === current.logical){
      playSfx('press');
      current.progress++;
      score += 1 + Math.floor(level/4);
      if(current.progress >= current.required){
        playSfx('success');
        level++;
        score += 50*level;
        generateSequence();
      }
    } else {
      timer -= 120;
    }
    return;
  }

  const expected = sequence[inputPos];
  if(!expected) return;

  playSfx('press');
  if(logical === expected.logical){
    inputPos++;
    score += 5 + Math.floor(level/3);
    if(inputPos >= sequence.length){
      playSfx('success');
      level++;
      score += 40*level;
      generateSequence();
    }
  } else {
    failGame();
  }
}

function drawRoundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.fill();
}

function strokeRoundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
  ctx.stroke();
}

function safeRoundRectPath(x,y,w,h,r){
  if(typeof ctx.roundRect === 'function'){
    ctx.roundRect(x,y,w,h,r);
  } else {
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
  }
}

function drawButton(x,y,logical,opts={filled:false,small:false}){
  const b = getButtonVisual(logical);
  const size = opts.small?28:44;
  // PS3 symbols looked visually larger because of their black shell + font scaling.
  // Keep Xbox unchanged; slightly reduce the PS3 face-button shell to match Xbox perceived size.
  const visualSize = currentLayoutKey === 'ps3' && b.kind === 'face' ? size * 0.92 : size;

  ctx.save();
  ctx.translate(x,y);

  if(b.kind==='shoulder'){
    if(currentLayoutKey === 'xbox360'){
      // Sonic Unleashed / Xbox 360 style: white rounded pill with grey bevel.
      const pillW = 72;
      const pillH = 34;
      const px = -pillW/2;
      const py = -pillH/2;
      const grd = ctx.createLinearGradient(0, py, 0, py + pillH);
      grd.addColorStop(0, '#ffffff');
      grd.addColorStop(0.55, '#e8ecec');
      grd.addColorStop(1, '#b8c0c0');
      ctx.fillStyle = grd;
      drawRoundedRect(px, py, pillW, pillH, 10);
      ctx.strokeStyle = '#1d2528';
      ctx.lineWidth = 2.5;
      strokeRoundedRect(px, py, pillW, pillH, 10);
      ctx.strokeStyle = 'rgba(255,255,255,0.75)';
      ctx.lineWidth = 1;
      strokeRoundedRect(px+3, py+3, pillW-6, pillH-6, 8);
      ctx.fillStyle = '#f7f7f7';
      ctx.font = (opts.small?'15px ':'19px ') + 'Arial Black, Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#4a5053';
      ctx.strokeText(b.label,0,1);
      ctx.fillText(b.label,0,1);
    } else {
      // PS3 shoulder button: black base, white label.
      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#111111';
      ctx.lineWidth = 2;
      drawRoundedRect(-32,-18,64,36,10);
      ctx.fillStyle = '#ffffff';
      ctx.font = (opts.small?'13px ':'16px ') + 'Arial';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillText(b.label,0,0);
    }
  } else {
    const fillColor = b.fillColor || '#000000';
    const symbolColor = b.symbolColor || b.color;
    const radius = visualSize / 2;

    if(currentLayoutKey === 'xbox360'){
      // Sonic Unleashed / Xbox 360 style: glossy colored button with dark rim.
      ctx.beginPath();
      ctx.arc(0,0,radius,0,Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = '#111820';
      ctx.fill();

      const outerGrad = ctx.createRadialGradient(-7,-8,3,0,0,radius);
      outerGrad.addColorStop(0,'#ffffff');
      outerGrad.addColorStop(0.22, fillColor);
      outerGrad.addColorStop(0.72, fillColor);
      outerGrad.addColorStop(1,'#1b1b1b');
      ctx.beginPath();
      ctx.arc(0,0,radius-2,0,Math.PI*2);
      ctx.fillStyle = outerGrad;
      ctx.fill();
      ctx.strokeStyle = '#0a0d12';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(-6,-7,radius*0.42,0,Math.PI*2);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fill();
    } else {
      // PS3 style: black circular shell with colored symbol only.
      const shellGrad = ctx.createRadialGradient(-6,-7,2,0,0,radius);
      shellGrad.addColorStop(0,'#4a4a4a');
      shellGrad.addColorStop(0.38,'#1c1c1c');
      shellGrad.addColorStop(1,'#101010');

      ctx.beginPath();
      ctx.arc(0,0,radius,0,Math.PI*2);
      ctx.closePath();
      ctx.fillStyle = shellGrad;
      ctx.fill();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    ctx.fillStyle = symbolColor;
    ctx.font = currentLayoutKey === 'xbox360'
      ? (opts.small?'17px ':'21px ') + 'Arial Black, Arial'
      : (opts.small?'16px ':'20px ') + 'Arial';
    ctx.textAlign='center';
    ctx.textBaseline='middle';

    const scale = b.scale || 1;
    const offsetX = b.offsetX || 0;
    const offsetY = b.offsetY || 1;
    ctx.save();
    ctx.scale(scale, scale);
    if(currentLayoutKey === 'xbox360'){
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(0,0,0,0.65)';
      ctx.strokeText(b.label, offsetX / scale, offsetY / scale);
    }
    ctx.fillText(b.label, offsetX / scale, offsetY / scale);
    ctx.restore();
  }

  ctx.restore();
}

function draw(){
  const W = canvas.clientWidth;
  const H = canvas.clientHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = 'rgba(255,255,255,0.02)';
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle='#dbe7ff';
  ctx.font='18px Arial';
  ctx.textAlign='left';
  ctx.fillText('Score: ' + score, 18, 28);
  ctx.fillText('Level: ' + level, 18, 52);
  ctx.fillText('Layout: ' + currentLayout.name, 18, 76);
  ctx.fillText('Record: ' + record.score + ' / Lv ' + record.level, 18, 100);

  const seqY = H*0.46;
  const spacing = 70;
  const isSinglePrompt = sequence.length === 1;
  const totalSeqWidth = (sequence.length - 1) * spacing;
  const startX = isSinglePrompt ? W / 2 : (W / 2) - (totalSeqWidth / 2);

  for(let i=0;i<sequence.length;i++){
    const s = sequence[i];
    const x = startX + i*spacing;
    ctx.globalAlpha = (i < inputPos)? 0.4 : 1.0;

    if(s.type==='mash'){
      drawButton(x, seqY, s.logical, {filled:false});
      const w = 160;
      const h = 12;
      const gx = W/2 - w/2;
      const gy = seqY + 60;
      ctx.fillStyle='#333';
      ctx.fillRect(gx,gy,w,h);
      const ratio = s.progress / s.required;
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(gx,gy,w*ratio,h);
      ctx.fillStyle='#dbe7ff';
      ctx.font='14px Arial';
      ctx.textAlign='center';
      ctx.fillText(s.progress + ' / ' + s.required, W/2, gy + h + 18);
    } else {
      drawButton(x, seqY, s.logical, {filled: i < inputPos});
    }
    ctx.globalAlpha = 1;
  }

  if(sequence.length === 1){
    // Single-button QTE: circular timer around the button.
    const ratio = Math.max(0, timer / timeLimit);
    // Visual-only acceleration illusion: actual duration still follows 3s / 5s / 10s rules.
    const visualRatio = Math.pow(ratio, 1.75);
    const ringX = W / 2;
    const ringY = seqY;
    const ringRadius = 29;
    const startAngle = -Math.PI / 2;
    const endAngle = startAngle + Math.PI * 2 * visualRatio;

    ctx.beginPath();
    ctx.arc(ringX, ringY, ringRadius, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 6;
    ctx.stroke();

    // Time-color interpolation: gold at full time, true red near failure.
    const redR = 220;
    const redG = 0;
    const redB = 0;
    const yellowR = 255;
    const yellowG = 215;
    const yellowB = 0;
    const colorR = Math.round(redR + (yellowR - redR) * visualRatio);
    const colorG = Math.round(redG + (yellowG - redG) * visualRatio);
    const colorB = Math.round(redB + (yellowB - redB) * visualRatio);

    ctx.beginPath();
    ctx.arc(ringX, ringY, ringRadius, startAngle, endAngle);
    ctx.strokeStyle = `rgb(${colorR},${colorG},${colorB})`;
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.lineCap = 'butt';
  } else {
    // Multi-button timer bar: length roughly matches the prompted button sequence width.
    const buttonSpan = Math.max(120, (sequence.length - 1) * spacing + 44);
    const barW = Math.min(buttonSpan + 36, W * 0.8);
    const barH = 18;
    const bx = (W - barW)/2;
    const by = H*0.6;
    ctx.fillStyle = '#1a2b3b';
    drawRoundedRect(bx,by,barW,barH,barH/2);
    const ratio = Math.max(0, timer / timeLimit);
    // Visual-only acceleration illusion: actual duration still follows 3s / 5s / 10s rules.
    const visualRatio = Math.pow(ratio, 1.75);
    const grd = ctx.createLinearGradient(bx,0,bx+barW,0);
    grd.addColorStop(0,'rgb(255,215,0)');
    grd.addColorStop(1,'rgb(220,0,0)');
    ctx.save();
    ctx.beginPath();
    safeRoundRectPath(bx, by, barW, barH, barH/2);
    ctx.clip();
    ctx.fillStyle = grd;
    ctx.fillRect(bx + barW * (1 - visualRatio), by, barW * visualRatio, barH);
    ctx.restore();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    strokeRoundedRect(bx,by,barW,barH,barH/2);
  }

  ctx.fillStyle = '#9fb4d9';
  ctx.font='13px Arial';
  ctx.textAlign='center';
  const hintY = sequence.length === 1 ? seqY - 62 : H*0.6 - 14;
  if(seqType==='mash') ctx.fillText('MASH: press the shown button rapidly!', W/2, hintY);
  else ctx.fillText('Press buttons in order before the timer empties', W/2, hintY);

  if(!running){
    ctx.fillStyle='rgba(2,6,12,0.7)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='42px Arial';
    ctx.textAlign='center';
    ctx.fillText('GAME OVER', W/2, H/2 - 10);
    ctx.font='16px Arial';
    ctx.fillText('Press Restart to try again', W/2, H/2 + 24);
    ctx.fillText('Best Record: ' + record.score + ' / Lv ' + record.level + ' (' + formatRecordDate(record.date) + ')', W/2, H/2 + 50);
  }
}

let last = performance.now();
function loop(now){
  const dt = now - last;
  last = now;
  if(running){
    timer -= dt;
    if(timer <= 0){
      failGame();
    }
  }
  pollGamepad();
  draw();
  requestAnimationFrame(loop);
}

function restartGame(){
  score = 0;
  level = 1;
  running = true;
  lastGPState = {};
  generateSequence();
}

function toggleLayout(){
  currentLayoutKey = currentLayoutKey === 'xbox360' ? 'ps3' : 'xbox360';
  currentLayout = LAYOUTS[currentLayoutKey];
  document.getElementById('layoutSelect').value = currentLayoutKey;
  lastGPState = {};
  saveLayoutPreference();
}

document.getElementById('restart').addEventListener('click', restartGame);
document.getElementById('layoutSelect').addEventListener('change', e=>{
  currentLayoutKey = e.target.value;
  currentLayout = LAYOUTS[currentLayoutKey];
  lastGPState = {};
  saveLayoutPreference();
  // Preserve gameplay sequence logically; only visuals/input labels change.
});

window.addEventListener('resize', ()=>{ setupCanvas(); draw(); });

document.getElementById('layoutSelect').value = currentLayoutKey;
generateSequence();
requestAnimationFrame(loop);

// --- Minimal sanity tests (non-invasive) ---
(function tests(){
  console.assert(LAYOUTS.ps3.buttons.FACE_BOTTOM.label==='X','PS3 bottom face label');
